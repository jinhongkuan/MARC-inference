<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" role="img" aria-label="Four monthly valet trash invoices, $3,330, $5,772, $4,884 and $5,280, look unremarkable because totals scale with property size. Factored by the Prolog rule ensure_uniform_spend into doors times price per door, three properties pay $18.50 a door and OAK-03 pays $22.00. That cell does not add up: $3.50 a door over 240 doors is $840 a month, which goes to an agent that phones the vendor.">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.f{font-family:Georgia,'Times New Roman',serif}
.h{font-size:15px;font-weight:600;fill:#111}
.sub{font-size:12px;fill:#6b7280}
.t{font-size:12.5px;font-weight:600;fill:#111}
.kind{font-size:11px;fill:#6b7280;font-weight:400}
.l{font-size:11px;fill:#6b7280}
.lk{font-size:11px;fill:#111}
.lsm{font-size:10px;fill:#6b7280}
.v{font-size:11.5px;fill:#111}
.c{font-size:9.5px;fill:#9ca3af}
.q{font-size:11.5px;font-style:italic;fill:#374151}
.cap{font-size:9px;letter-spacing:1.2px;font-weight:600;fill:#111}
.capsub{font-size:10px;fill:#6b7280}
.code{font-size:9.5px;fill:#24292f}
.fn{fill:#8250df}.var{fill:#953800}.num{fill:#0550ae}.kw{fill:#cf222e}.atom{fill:#0a3069}.ref{fill:#8c959f}
.cmt{fill:#6e7781;font-style:italic}
.dim{fill:#8c959f}.ink{fill:#24292f}.bad{fill:#cf222e;font-weight:700}.good{fill:#1a7f37;font-weight:600}
.val{font-size:9.5px;fill:#6b7280}
.valr{font-size:9.5px;fill:#cf222e;font-weight:700}
.gap{font-size:9.5px;fill:#cf222e;font-weight:600}
.ok{font-size:9px;fill:#1a7f37}
.eq{font-size:10.5px;fill:#374151}
.res{font-size:13px;font-weight:600;fill:#1a7f37}
.resb{font-size:17px;font-weight:600;fill:#1a7f37}
.u{font-size:11px;fill:#6b7280}
.n{font-size:12px;fill:#111}
.nr{font-size:12px;fill:#cf222e;font-weight:700}
.op{font-size:12px;fill:#9ca3af}
.a{font-size:10.5px;fill:#6b7280}
.miss{font-size:10.5px;font-style:italic;fill:#cf222e}
.pill{font-size:10.5px;font-weight:600;fill:#4d2d00}

.tot{font-size:16px;fill:#111}
.fac{font-size:13px;fill:#111}
.x{fill:#9ca3af}
.rate{fill:#0550ae}
.off{fill:#cf222e;font-weight:700}
.tab{font-size:10px;fill:#6b7280}
.flag{font-size:9.5px;fill:#cf222e;font-weight:600}
.fine{font-size:10.5px;fill:#6b7280;font-style:italic}
</style>
<rect x="0.5" y="0.5" width="959" height="351" rx="14" fill="#fff" stroke="#e5e7eb"/>
<text x="32" y="52" class="s h" text-anchor="start">Rulesets turn reconciliation gaps into phone calls</text>
<text x="32" y="72" class="s sub" text-anchor="start">four totals look fine; factored under a named rule, one cell doesn't add up and becomes a call</text>
<text x="32" y="108" class="s cap" text-anchor="start">INVOICE TOTALS</text>
<text x="32" y="122" class="s capsub" text-anchor="start">valet trash, this month</text>
<text x="40" y="166" class="s l" text-anchor="start">ELM-09</text>
<text x="40" y="188" class="m tot" text-anchor="start">$3,330.00</text>
<text x="152" y="166" class="s l" text-anchor="start">BIRCH-02</text>
<text x="152" y="188" class="m tot" text-anchor="start">$5,772.00</text>
<text x="40" y="226" class="s l" text-anchor="start">PINE-12</text>
<text x="40" y="248" class="m tot" text-anchor="start">$4,884.00</text>
<text x="152" y="226" class="s l" text-anchor="start">OAK-03</text>
<text x="152" y="248" class="m tot" text-anchor="start">$5,280.00</text>
<text x="40" y="286" class="s fine" text-anchor="start">nothing stands out:</text>
<text x="40" y="301" class="s fine" text-anchor="start">totals scale with door count</text>
<text x="271" y="198" class="s l" text-anchor="middle">factor</text>
<line x1="256" y1="206" x2="285" y2="206" stroke="#111" stroke-width="1.25"/>
<path d="M280,202 L286,206 L280,210" fill="none" stroke="#111" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="294" y="108" class="s cap" text-anchor="start">FACTOR</text>
<text x="294" y="122" class="s capsub" text-anchor="start">doors × $ per door</text>
<rect x="450" y="207" width="153" height="58" rx="3" fill="#ffebe9" stroke="none" stroke-width="1"/>
<rect x="294" y="146" width="310" height="120" rx="4" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="449" y1="146" x2="449" y2="266" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="294" y1="206" x2="604" y2="206" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="302" y="138" width="128" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1"/>
<text x="308" y="150" class="m tab" text-anchor="start">ensure_uniform_spend</text>
<text x="308" y="168" class="s l" text-anchor="start">ELM-09</text>
<text x="308" y="190" class="m fac" text-anchor="start" xml:space="preserve"><tspan class="fac">180</tspan><tspan class="x"> × </tspan><tspan class="rate">18.50</tspan></text>
<text x="463" y="168" class="s l" text-anchor="start">BIRCH-02</text>
<text x="463" y="190" class="m fac" text-anchor="start" xml:space="preserve"><tspan class="fac">312</tspan><tspan class="x"> × </tspan><tspan class="rate">18.50</tspan></text>
<text x="308" y="228" class="s l" text-anchor="start">PINE-12</text>
<text x="308" y="250" class="m fac" text-anchor="start" xml:space="preserve"><tspan class="fac">264</tspan><tspan class="x"> × </tspan><tspan class="rate">18.50</tspan></text>
<text x="463" y="228" class="s l" text-anchor="start">OAK-03</text>
<text x="592" y="228" class="s flag" text-anchor="end">+3.50 / door</text>
<text x="463" y="250" class="m fac" text-anchor="start" xml:space="preserve"><tspan class="fac">240</tspan><tspan class="x"> × </tspan><tspan class="off">22.00</tspan></text>
<line x1="608" y1="236.0" x2="637" y2="236.0" stroke="#cf222e" stroke-width="1.25"/>
<path d="M632,232.0 L638,236.0 L632,240.0" fill="none" stroke="#cf222e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="646" y="108" class="s cap" text-anchor="start">AGENT</text>
<text x="646" y="122" class="s capsub" text-anchor="start">takes the cited gap</text>
<rect x="646" y="204.0" width="64" height="64" rx="12" fill="#fff" stroke="#111" stroke-width="1.25"/>
<g transform="translate(662.0,220.0) scale(1.3333333333333333)" fill="none" stroke="#111" stroke-width="1.425" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g>
<line x1="718" y1="236.0" x2="741" y2="236.0" stroke="#111" stroke-width="1.25"/>
<path d="M736,232.0 L742,236.0 L736,240.0" fill="none" stroke="#111" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="750" y="108" class="s cap" text-anchor="start">CALL</text>
<text x="750" y="122" class="s capsub" text-anchor="start">vendor V-114</text>
<rect x="750" y="204.0" width="64" height="64" rx="12" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.25"/>
<g transform="translate(766.0,220.0) scale(1.3333333333333333)" fill="none" stroke="#fff" stroke-width="1.425" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2a9 9 0 0 1 9 9"/><path d="M13 6a5 5 0 0 1 5 5"/><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></g>
<text x="826" y="232.0" class="s res" text-anchor="start">$840.00</text>
<text x="826" y="248.0" class="s u" text-anchor="start">/ month at stake</text>
<rect x="646" y="284" width="290" height="44" rx="8" fill="#f3f4f6" stroke="none" stroke-width="1"/>
<text x="658" y="302" class="s q" text-anchor="start">“Your other three sites pay $18.50 a door.</text>
<text x="658" y="317" class="s q" text-anchor="start">Can you match it at OAK-03?”</text>
</svg>
