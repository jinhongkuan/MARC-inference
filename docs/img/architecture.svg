<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Left, fixed schema: every document is parsed into every field; qty, total, date and acct are parsed but never used, and amending uniform_price to uniform_price_v2 backfills a clause column across every document. Right, read-through cache: uniform_price reaches only vendor, item, price and doors through portfolio_gap and per_door, read in one batched model call; uniform_price_v2 reuses that work from the cache and adds clause in a second batch; qty, total, date and acct are never computed.">
