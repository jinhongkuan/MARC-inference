<text x="324" y="314.0" class="m snip" text-anchor="start" xml:space="preserve"><tspan class="ln"> 6  </tspan><tspan class="ink">Valet trash </tspan><tspan class="ink">252 doors</tspan><tspan class="ink"> @ </tspan><tspan class="ink">22.00</tspan></text>
