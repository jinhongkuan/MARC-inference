<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 616" width="700" height="616" role="img" aria-label="Two separate Prolog rules, each searching the same documents with targeted highlights and computing explicitly. Rule 1, the fee-cap rule, passes its test at $146.32 a month over cap and ships now. Rule 2, the billable-doors rule, never queries the price sheet in its first version, returns $0.00 and fails its test, so it is delayed to next quarter while rule 1 ships without it.">
