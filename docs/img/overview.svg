<text x="594" y="150" class="s ntag" text-anchor="end">RULE · PROLOG</text>
<text x="324" y="160" class="m code" text-anchor="start" xml:space="preserve"><tspan class="cmt">% surcharges stay within the vendor's cap</tspan></text>
<text x="324" y="172" class="m code" text-anchor="start" xml:space="preserve"><tspan class="fn">over_fee_cap</tspan><tspan class="ink">(</tspan><tspan class="var">Inv</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">Over</tspan><tspan class="ink">)</tspan><tspan class="ink"> </tspan><tspan class="kw">:-</tspan></text>
<text x="324" y="184" class="m code" text-anchor="start" xml:space="preserve"><tspan class="ink">  </tspan><tspan class="fn">vendor</tspan><tspan class="ink">(</tspan><tspan class="var">Inv</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">V</tspan><tspan class="ink">)</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="fn">base</tspan><tspan class="ink">(</tspan><tspan class="var">Inv</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">B</tspan><tspan class="ink">)</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="fn">fee_cap</tspan><tspan class="ink">(</tspan><tspan class="var">V</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">Cap</tspan><tspan class="ink">)</tspan><tspan class="ink">,</tspan></text>
<text x="324" y="196" class="m code" text-anchor="start" xml:space="preserve"><tspan class="ink">  </tspan><tspan class="fn">fees</tspan><tspan class="ink">(</tspan><tspan class="var">Inv</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">B</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">Fees</tspan><tspan class="ink">)</tspan><tspan class="ink">,</tspan><tspan class="ink">     </tspan><tspan class="cmt">% compounds</tspan></text>
<text x="324" y="208" class="m code" text-anchor="start" xml:space="preserve"><tspan class="ink">  </tspan><tspan class="var">Over</tspan><tspan class="ink"> </tspan><tspan class="kw">is</tspan><tspan class="ink"> </tspan><tspan class="var">Fees</tspan><tspan class="ink"> </tspan><tspan class="kw">-</tspan><tspan class="ink"> </tspan><tspan class="var">B</tspan><tspan class="kw">*</tspan><tspan class="var">Cap</tspan><tspan class="ink">,</tspan><tspan class="ink"> </tspan><tspan class="var">Over</tspan><tspan class="ink"> </tspan><tspan class="kw">&gt;</tspan><tspan class="ink"> </tspan><tspan class="num">0</tspan><tspan class="ink">.</tspan></text>
