<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="UML-style component diagram. Out of scope, as the motivating use case: a pending spend decision and the voice agent. A spend decision queries the Prolog engine, which loads stored facts from a sparse Postgres fact table. Facts it finds missing go onto a message queue; extraction workers drain the queue in batches, read the source documents from the document store, and write the facts back, and the engine reruns. Findings go to a voice agent, and a human approves.">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.n{font-size:12.5px;font-weight:600;fill:#111}
.d{font-size:10.5px;fill:#6b7280}
.st{font-size:9.5px;fill:#57606a}
.e{font-size:10px;fill:#57606a;font-style:italic}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
