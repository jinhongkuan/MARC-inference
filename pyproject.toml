[project]
name = "marc-inference"
version = "0.1.0"
description = "Spike: infer owner-vendor relationships from invoices, GL exports and pricing sheets, find missed savings, and benchmark what each pipeline costs to run."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
marc = "marc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
